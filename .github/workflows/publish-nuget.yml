name: Publish NuGet Packages
# Setup and release instructions: RELEASING.md
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-nuget
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        id: dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"

      - name: Select installed SDK
        env:
          DOTNET_SDK_VERSION: ${{ steps.dotnet.outputs.dotnet-version }}
        run: |
          dotnet new globaljson --sdk-version "$DOTNET_SDK_VERSION" --roll-forward disable
          dotnet --version

      - name: Restore
        run: dotnet restore src/ClearFeatureActions.sln --source https://api.nuget.org/v3/index.json

      - name: Build (Release)
        run: dotnet build src/ClearFeatureActions.sln -c Release --no-restore -p:GeneratePackageOnBuild=false

      - name: Test
        run: dotnet test src/ClearFeatureActions.sln -c Release --no-build --no-restore

      - name: Pack ClearFeatureActions
        run: dotnet pack src/ClearFeatureActions/ClearFeatureActions.csproj -c Release --no-build -o ./artifacts

      - name: Retain tested release packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ github.sha }}
          path: artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 7

      - name: Validate NuGet API Key
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NUGET_API_KEY is not configured. See RELEASING.md."
            exit 1
          fi

      - name: Push packages to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          for pkg in ./artifacts/*.nupkg; do
            dotnet nuget push "$pkg" \
              --api-key "$NUGET_API_KEY" \
              --source "https://api.nuget.org/v3/index.json" \
              --skip-duplicate
          done
